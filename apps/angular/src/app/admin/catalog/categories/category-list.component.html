<div class="row">
  <div class="col-12">
    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0">{{ 'ECommerce::Categories' | abpLocalization }}</h5>
        <a routerLink="/admin/catalog/categories/create" class="btn btn-primary btn-sm">
          <i class="fa fa-plus me-1"></i>
          {{ 'ECommerce::NewCategory' | abpLocalization }}
        </a>
      </div>
      <div class="card-body">
        @if (loading) {
          <p class="text-muted mb-0">{{ 'ECommerce::Loading' | abpLocalization }}</p>
        } @else {
          <app-category-tree
            [nodes]="tree"
            [deletingId]="deletingId"
            (delete)="deleteCategory($event)"
          />
          @if (tree.length === 0) {
            <p class="text-muted mb-0">{{ 'ECommerce::NoCategories' | abpLocalization }}</p>
          }
        }
      </div>
    </div>
  </div>
</div>
